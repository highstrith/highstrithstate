<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Highstrith | 作品管理</title>
  <link rel="stylesheet" href="admin.css?v=20261007-2" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Highstrith 橘小桔">
        <span class="brand-name">Highstrith<span>橘小桔</span></span>
        <span class="brand-role" id="brandRole">作品管理</span>
      </a>
      <div class="topbar-actions">
        <a class="btn public-site-link" id="publicSiteLink" href="/">
          <span id="publicSiteLinkLabel">查看作品集</span>
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 15 15 5M5 5h10v10" stroke="currentColor" stroke-width="1.4"/></svg>
        </a>
        <button class="chip-btn" id="langSwitch" type="button" aria-label="Switch to English" aria-pressed="false">
          <strong id="langCurrent">CN</strong><span>/</span><strong id="langTarget">EN</strong>
        </button>
      </div>
    </header>
    <main>
      <section class="hero" aria-labelledby="heroTitle">
        <div class="hero-copy">
          <p class="eyebrow" id="heroEyebrow">创作工作台</p>
          <h1 id="heroTitle">让好作品，被看见</h1>
          <p class="lede" id="heroDesc">整理每一次创作，更新你的影像作品集。</p>
        </div>
        <div class="hero-side">
          <div class="mini-note"><p class="section-kicker" id="privacyKicker">本地管理</p><p id="privacyNote">在这台电脑上维护作品。</p></div>
          <div class="mini-note"><p class="section-kicker" id="syncKicker">作品同步</p><p id="syncNote">保存后，本地作品集立即更新。线上更新需发布。</p></div>
        </div>
      </section>
      <section class="content" aria-label="作品管理">
        <article class="panel manage-form-panel" id="manageFormPanel" aria-labelledby="uploadPanelTitle">
          <div class="panel-head"><div class="copy">
            <p class="section-kicker" id="uploadEyebrow">作品编辑器</p>
            <h2 id="uploadPanelTitle">添加新作品</h2>
            <p id="uploadPanelNote">填写作品信息，再添加视频与封面。</p>
            <p class="upload-mode-note" id="uploadModeNote">新作品将加入本地作品集。</p>
          </div></div>
          <form class="upload-form" id="uploadForm" novalidate>
            <fieldset class="upload-group">
              <legend id="detailsGroupLabel">作品信息</legend>
              <div class="upload-grid">
                <label class="upload-field"><span class="field-label" id="uploadCnTitleLabel">中文标题</span><input class="upload-input" id="uploadCnTitleInput" name="cnTitle" type="text" maxlength="80" placeholder="作品名称" /></label>
                <label class="upload-field"><span class="field-label" id="uploadEnTitleLabel">英文标题</span><input class="upload-input" id="uploadEnTitleInput" name="enTitle" type="text" maxlength="80" placeholder="Project title" /></label>
                <label class="upload-field"><span class="field-label" id="uploadCnSubLabel">中文分类</span><input class="upload-input" id="uploadCnSubInput" name="cnSub" type="text" maxlength="64" placeholder="品牌 / 剪辑" /></label>
                <label class="upload-field"><span class="field-label" id="uploadEnSubLabel">英文分类</span><input class="upload-input" id="uploadEnSubInput" name="enSub" type="text" maxlength="64" placeholder="Brand / Editing" /></label>
                <label class="upload-field"><span class="field-label" id="uploadCnDescLabel">中文简介</span><textarea class="upload-input" id="uploadCnDescInput" name="cnDesc" maxlength="180" rows="3" placeholder="这部作品的故事与创作想法"></textarea></label>
                <label class="upload-field"><span class="field-label" id="uploadEnDescLabel">英文简介</span><textarea class="upload-input" id="uploadEnDescInput" name="enDesc" maxlength="180" rows="3" placeholder="The story behind this project"></textarea></label>
              </div>
            </fieldset>
            <fieldset class="upload-group">
              <legend id="mediaGroupLabel">视频与封面</legend>
              <div class="upload-grid media-grid">
                <label class="upload-field">
                  <span class="field-label" id="uploadVideoLabel">作品视频</span>
                  <input class="upload-input" id="uploadVideoInput" name="videoFile" type="file" accept=".mp4,video/mp4" aria-describedby="uploadVideoHelp" />
                  <small class="field-help" id="uploadVideoHelp">选择 MP4 成片，建议先压缩以便流畅播放。</small>
                </label>
                <label class="upload-field">
                  <span class="field-label" id="uploadPosterLabel">封面图（可选）</span>
                  <input class="upload-input" id="uploadPosterInput" name="posterFile" type="file" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" aria-describedby="uploadPosterHelp" />
                  <small class="field-help" id="uploadPosterHelp">支持 JPG、PNG、WEBP；留空则从新视频自动生成。</small>
                </label>
              </div>
            </fieldset>
            <div class="format-note"><span id="heroFormatLabel">支持格式</span><strong>MP4 / JPG / PNG / WEBP</strong></div>
            <div class="upload-actions">
              <button class="btn primary" id="uploadSubmit" type="submit"><span id="uploadSubmitLabel">添加到作品集</span></button>
              <button class="btn" id="uploadCancelEdit" type="button" hidden><span id="uploadCancelEditLabel">取消编辑</span></button>
              <p class="upload-hint" id="uploadHint">保存后可继续编辑，刷新页面不会丢失。</p>
            </div>
            <p class="upload-status" id="uploadStatus" aria-live="polite"></p>
          </form>
        </article>
        <article class="panel library-panel" aria-labelledby="manageTitle">
          <div class="panel-head"><div class="copy">
            <p class="section-kicker" id="manageKicker">每一帧，都值得留存</p>
            <div class="library-heading"><h2 id="manageTitle">作品库</h2><span class="work-count"><strong id="heroWorkCount">0</strong><span id="heroWorkCountLabel">部作品</span></span></div>
            <p id="manageNote">点击封面观看视频，或编辑作品信息。</p>
          </div></div>
          <div class="manage-list" id="manageList"></div>
        </article>
      </section>
    </main>
  </div>
  <dialog class="manage-video-dialog" id="manageVideoDialog" aria-label="作品视频预览">
    <button class="manage-video-close" id="manageVideoClose" type="button" aria-label="关闭视频">×</button>
    <video id="manageVideoPlayer" controls playsinline preload="metadata"></video>
  </dialog>

  <script>
    (() => {
      const initialLang = localStorage.getItem('site-lang') === 'en' ? 'en' : 'cn';
      const state = { lang: initialLang };

      const translations = {
        cn: {
          pageTitle: 'Highstrith | 作品管理',
          brandRole: '作品管理',
          publicSiteLink: '查看作品集',
          heroEyebrow: '创作工作台',
          heroTitle: '让好作品，被看见',
          heroDesc: '整理每一次创作，更新你的影像作品集。',
          heroWorkCountLabel: '部作品',
          heroFormatLabel: '支持格式',
          privacyKicker: '本地管理',
          privacyNote: '在这台电脑上维护作品。',
          syncKicker: '作品同步',
          syncNote: '保存后，本地作品集立即更新。线上更新需发布。',
          uploadEyebrow: '作品编辑器',

          uploadModeBuiltIn: '精选作品：可编辑文字，视频与封面已锁定。',
          detailsGroupLabel: '作品信息',

          uploadEnSubPlaceholder: 'Brand / Editing',
          uploadCnDescLabel: '中文简介',
          uploadEnDescLabel: '英文简介',
          uploadCnDescPlaceholder: '这部作品的故事与创作想法',
          uploadEnDescPlaceholder: 'The story behind this project',
          uploadVideoLabel: '作品视频',
          uploadPosterLabel: '封面图（可选）',
          uploadVideoHelp: '选择 MP4 成片，建议先压缩以便流畅播放。',
          uploadPosterHelp: '支持 JPG、PNG、WEBP；留空则从新视频自动生成。',
          uploadVideoHelpEdit: '留空保留当前视频；选择新 MP4 即可替换。',
          uploadPosterHelpEdit: '留空保留当前封面；选择新图片即可替换。',
          uploadMediaLocked: '此精选作品的媒体不可在这里替换。',

          uploadCancelEdit: '取消编辑',
          uploadHint: '保存在本机，刷新不会丢失；线上更新需发布。',
          uploadIdle: '可以开始了。',
          uploadNeedVideo: '请先选择一个 MP4 视频文件。',
          uploadGeneratingPoster: '正在从视频自动生成封面…',

          uploadUploadingPoster: '正在上传封面图…',
          uploadSavingWork: '正在写入作品信息…',
          uploadUpdatingWork: '正在保存作品修改…',
          uploadDeletingWork: '正在删除作品…',
          uploadSuccess: '上传完成，新作品已经加入作品集。',
          uploadUpdated: '作品修改已保存。',
          uploadDeleted: '作品已删除。',
          uploadDeleteConfirm: '确定删除这条已上传作品吗？对应的视频和封面也会一并移除。',

          manageKicker: '每一帧，都值得留存',

          manageEmpty: '还没有作品。上传一条作品后，它会立刻出现在这里。',
          manageItemTag: '已上传',

          manageDelete: '删除',
          langCurrent: 'CN',
          langTarget: 'EN'
        },
        en: {
          pageTitle: 'Highstrith | Work Admin',
          brandRole: 'Work Admin',
          publicSiteLink: 'View portfolio',
          heroEyebrow: 'Creative workspace',
          heroTitle: 'Make room for great work',
          heroDesc: 'A home for every project. Keep your film portfolio up to date.',
          heroWorkCountLabel: 'projects',
          heroFormatLabel: 'Supported formats',
          privacyKicker: 'Local studio',
          privacyNote: 'Manage your projects on this computer.',
          syncKicker: 'Updates',
          syncNote: 'Saves update your local portfolio. Publish to update the live site.',
          uploadEyebrow: 'Project editor',
          uploadTitle: 'Add a new project',
          uploadTitleEdit: 'Edit project',
          uploadNote: 'Add the details, then choose your film and cover.',
          uploadNoteEdit: 'Update the details and save to see your changes.',
          uploadModeCreate: 'New work joins your local portfolio.',
          uploadModeEdit: 'Edit the details or choose files to replace your media.',
          uploadModeBuiltIn: 'Featured project: edit the details. Video and cover are locked.',
          detailsGroupLabel: 'Project details',
          mediaGroupLabel: 'Film and cover',
          uploadCnTitleLabel: 'Chinese title',
          uploadEnTitleLabel: 'English title',
          uploadCnSubLabel: 'Chinese category',
          uploadEnSubLabel: 'English category',
          uploadCnTitlePlaceholder: 'Project title',
          uploadEnTitlePlaceholder: 'Project title',
          uploadCnSubPlaceholder: 'Brand / Editing',
          uploadEnSubPlaceholder: 'Brand / Editing',
          uploadCnDescLabel: 'Chinese description',
          uploadEnDescLabel: 'English description',
          uploadCnDescPlaceholder: 'The story behind this project',
          uploadEnDescPlaceholder: 'The story behind this project',
          uploadVideoLabel: 'Project video',
          uploadPosterLabel: 'Cover image (optional)',
          uploadVideoHelp: 'Choose an MP4 film. Compress it first for smoother playback.',
          uploadPosterHelp: 'JPG, PNG or WEBP. Leave blank to generate a cover from the new video.',
          uploadVideoHelpEdit: 'Leave blank to keep the video, or choose a new MP4 to replace it.',
          uploadPosterHelpEdit: 'Leave blank to keep the cover, or choose a new image to replace it.',
          uploadMediaLocked: 'Media for this featured project cannot be replaced here.',
          uploadSubmit: 'Add to portfolio',
          uploadUpdate: 'Save Changes',
          uploadCancelEdit: 'Cancel Edit',
          uploadHint: 'Saved on this computer, including after refresh. Publish to update the live site.',
          uploadIdle: 'Ready when you are.',
          uploadNeedVideo: 'Please choose an MP4 video file first.',
          uploadGeneratingPoster: 'Generating a poster from the selected video…',
          uploadUploadingVideo: 'Uploading the video file…',
          uploadUploadingPoster: 'Uploading the poster image…',
          uploadSavingWork: 'Saving the work entry…',
          uploadUpdatingWork: 'Saving the work changes…',
          uploadDeletingWork: 'Deleting the work…',
          uploadSuccess: 'Upload complete. The new work is now in the portfolio.',
          uploadUpdated: 'The work changes have been saved.',
          uploadDeleted: 'The work has been deleted.',
          uploadDeleteConfirm: 'Delete this uploaded work? Its video and poster files will be removed as well.',
          uploadUnavailable: 'The local upload service is unavailable right now. Please try again shortly.',
          manageKicker: 'Every frame has a place',
          manageTitle: 'Project library',
          manageNote: 'Open a cover to watch the film, or edit the project details.',
          manageEmpty: 'No works yet. Add one and it will appear here immediately.',
          manageItemTag: 'Uploaded',
          manageBuiltInTag: 'Featured',
          manageCreated: 'Created',
          manageVideo: 'Video Path',
          managePoster: 'Poster Path',
          manageDescription: 'Description',
          manageNoPoster: 'No poster assigned yet',
          manageEdit: 'Edit details',
          manageView: 'View video',
          manageDelete: 'Delete',
          langCurrent: 'EN',
          langTarget: 'CN'
        }
      };

      const localServiceOrigin = 'http://127.0.0.1:3000';
      const isFileProtocol = window.location.protocol === 'file:';
      const serviceOrigin = isFileProtocol ? localServiceOrigin : window.location.origin;
      const serviceUrl = (path) => new URL(path, `${serviceOrigin}/`).toString();

      if (isFileProtocol) {
        const nextUrl = serviceUrl(`/admin.html${window.location.search}${window.location.hash}`);
        window.location.replace(nextUrl);
      }

      const langSwitch = document.getElementById('langSwitch');
      const langCurrent = document.getElementById('langCurrent');
      const langTarget = document.getElementById('langTarget');
      const brandRole = document.getElementById('brandRole');
      const publicSiteLink = document.getElementById('publicSiteLink');
      const publicSiteLinkLabel = document.getElementById('publicSiteLinkLabel');
      const heroEyebrow = document.getElementById('heroEyebrow');
      const heroTitle = document.getElementById('heroTitle');
      const heroDesc = document.getElementById('heroDesc');
      const heroWorkCount = document.getElementById('heroWorkCount');
      const heroWorkCountLabel = document.getElementById('heroWorkCountLabel');
      const heroFormatLabel = document.getElementById('heroFormatLabel');
      const privacyKicker = document.getElementById('privacyKicker');
      const privacyNote = document.getElementById('privacyNote');
      const syncKicker = document.getElementById('syncKicker');
      const syncNote = document.getElementById('syncNote');
      const uploadEyebrow = document.getElementById('uploadEyebrow');
      const uploadPanelTitle = document.getElementById('uploadPanelTitle');
      const uploadPanelNote = document.getElementById('uploadPanelNote');
      const uploadModeNote = document.getElementById('uploadModeNote');
      const uploadForm = document.getElementById('uploadForm');
      const uploadSubmit = document.getElementById('uploadSubmit');
      const uploadSubmitLabel = document.getElementById('uploadSubmitLabel');
      const uploadCancelEdit = document.getElementById('uploadCancelEdit');
      const uploadCancelEditLabel = document.getElementById('uploadCancelEditLabel');
      const uploadHint = document.getElementById('uploadHint');
      const uploadStatus = document.getElementById('uploadStatus');
      const uploadCnTitleLabel = document.getElementById('uploadCnTitleLabel');
      const uploadEnTitleLabel = document.getElementById('uploadEnTitleLabel');
      const uploadCnSubLabel = document.getElementById('uploadCnSubLabel');
      const uploadEnSubLabel = document.getElementById('uploadEnSubLabel');
      const uploadCnDescLabel = document.getElementById('uploadCnDescLabel');
      const uploadEnDescLabel = document.getElementById('uploadEnDescLabel');
      const uploadVideoLabel = document.getElementById('uploadVideoLabel');
      const uploadPosterLabel = document.getElementById('uploadPosterLabel');
      const uploadVideoHelp = document.getElementById('uploadVideoHelp');
      const uploadPosterHelp = document.getElementById('uploadPosterHelp');
      const detailsGroupLabel = document.getElementById('detailsGroupLabel');
      const mediaGroupLabel = document.getElementById('mediaGroupLabel');
      const uploadCnTitleInput = document.getElementById('uploadCnTitleInput');
      const uploadEnTitleInput = document.getElementById('uploadEnTitleInput');
      const uploadCnSubInput = document.getElementById('uploadCnSubInput');
      const uploadEnSubInput = document.getElementById('uploadEnSubInput');
      const uploadCnDescInput = document.getElementById('uploadCnDescInput');
      const uploadEnDescInput = document.getElementById('uploadEnDescInput');
      const uploadVideoInput = document.getElementById('uploadVideoInput');
      const uploadPosterInput = document.getElementById('uploadPosterInput');
      const manageKicker = document.getElementById('manageKicker');
      const manageTitle = document.getElementById('manageTitle');
      const manageNote = document.getElementById('manageNote');
      const manageList = document.getElementById('manageList');
      const manageFormPanel = document.getElementById('manageFormPanel');
      const manageVideoDialog = document.getElementById('manageVideoDialog');
      const manageVideoPlayer = document.getElementById('manageVideoPlayer');
      const manageVideoClose = document.getElementById('manageVideoClose');

      let uploadedWorkData = [];
      let uploadMode = 'create';
      let editingWorkId = '';
      let uploadSubmitting = false;
      let uploadStatusState = { key: 'uploadIdle', tone: 'muted', customMessage: '' };

      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));

      const normalizeWork = (item) => {
        const cnTitle = (item?.cnTitle || item?.enTitle || '未命名作品').trim();
        const enTitle = (item?.enTitle || item?.cnTitle || 'Untitled Work').trim();
        const cnSub = (item?.cnSub ?? item?.enSub ?? '').trim();
        const enSub = (item?.enSub ?? item?.cnSub ?? '').trim();

        return {
          id: item?.id || '',
          createdAt: item?.createdAt || '',
          cnTitle,
          enTitle,
          cnSub,
          enSub,
          cnDesc: (item?.cnDesc ?? '').trim(),
          enDesc: (item?.enDesc ?? item?.cnDesc ?? '').trim(),
          video: item?.video || '',
          previewVideo: typeof item?.previewVideo === 'string' ? item.previewVideo : '',
          webVideo: typeof item?.webVideo === 'string' ? item.webVideo : '',
          mobileVideo: item?.mobileVideo || '',
          poster: item?.poster || '',
        };
      };

      const isManagedWork = (item) => typeof item?.video === 'string' && item.video.startsWith('assets/uploads/');

      const managedWorks = () => uploadedWorkData;

      const findUploadedWork = (workId) => uploadedWorkData.find((item) => item.id === workId) || null;

      const replaceUploadedWork = (work) => {
        uploadedWorkData = [normalizeWork(work), ...uploadedWorkData.filter((item) => item.id !== work.id)];
      };

      const removeUploadedWork = (workId) => {
        uploadedWorkData = uploadedWorkData.filter((item) => item.id !== workId);
      };

      const updateHeroMetrics = () => {
        heroWorkCount.textContent = String(managedWorks().length);
      };

      const paintUploadStatus = () => {
        const copy = translations[state.lang];
        uploadStatus.textContent = uploadStatusState.customMessage || copy[uploadStatusState.key] || '';
        uploadStatus.dataset.tone = uploadStatusState.tone;
      };

      const setUploadStatus = (key, tone = 'muted', customMessage = '') => {
        uploadStatusState = { key, tone, customMessage };
        paintUploadStatus();
      };

      const setUploadSubmitting = (isSubmitting) => {
        uploadSubmitting = Boolean(isSubmitting);
        uploadSubmit.disabled = uploadSubmitting;
        uploadCancelEdit.disabled = uploadSubmitting;
      };

      const syncUploadModeUi = () => {
        const copy = translations[state.lang];
        const isEditing = uploadMode === 'edit';
        const currentWork = isEditing ? findUploadedWork(editingWorkId) : null;
        const mediaLocked = currentWork && !isManagedWork(currentWork);
        uploadPanelTitle.textContent = copy[isEditing ? 'uploadTitleEdit' : 'uploadTitle'];
        uploadPanelNote.textContent = copy[isEditing ? 'uploadNoteEdit' : 'uploadNote'];
        uploadModeNote.textContent = copy[mediaLocked ? 'uploadModeBuiltIn' : isEditing ? 'uploadModeEdit' : 'uploadModeCreate'];
        uploadVideoHelp.textContent = copy[mediaLocked ? 'uploadMediaLocked' : isEditing ? 'uploadVideoHelpEdit' : 'uploadVideoHelp'];
        uploadPosterHelp.textContent = copy[mediaLocked ? 'uploadMediaLocked' : isEditing ? 'uploadPosterHelpEdit' : 'uploadPosterHelp'];
        uploadSubmitLabel.textContent = copy[uploadMode === 'edit' ? 'uploadUpdate' : 'uploadSubmit'];
        uploadCancelEdit.hidden = uploadMode !== 'edit';
        uploadCancelEditLabel.textContent = copy.uploadCancelEdit;
      };

      const clearUploadForm = () => {
        uploadForm.reset();
      };

      const setUploadMode = (mode, work = null) => {
        uploadMode = mode === 'edit' ? 'edit' : 'create';
        editingWorkId = uploadMode === 'edit' && work?.id ? work.id : '';
        clearUploadForm();

        if (uploadMode === 'edit' && work) {
          uploadCnTitleInput.value = work.cnTitle || '';
          uploadEnTitleInput.value = work.enTitle || '';
          uploadCnSubInput.value = work.cnSub || '';
          uploadEnSubInput.value = work.enSub || '';
          uploadCnDescInput.value = work.cnDesc || '';
          uploadEnDescInput.value = work.enDesc || '';
        }

        const editingBuiltInWork = uploadMode === 'edit' && work && !isManagedWork(work);
        uploadVideoInput.disabled = Boolean(editingBuiltInWork);
        uploadPosterInput.disabled = Boolean(editingBuiltInWork);

        syncUploadModeUi();
        manageFormPanel.classList.toggle('is-editing', uploadMode === 'edit');
      };

      const openEditorForWork = (work) => {
        setUploadMode('edit', work);
        setUploadStatus('uploadIdle');
        uploadForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
        window.setTimeout(() => uploadCnTitleInput.focus({ preventScroll: true }), 350);
      };

      const openWorkPreview = async (work) => {
        if (!work?.video || !manageVideoDialog || !manageVideoPlayer) return;
        manageVideoPlayer.poster = work.poster || '';
        manageVideoPlayer.src = work.webVideo || work.video;
        manageVideoDialog.showModal();
        try { await manageVideoPlayer.play(); } catch (_) {}
      };

      const closeWorkPreview = () => {
        manageVideoPlayer.pause();
        manageVideoPlayer.removeAttribute('src');
        manageVideoPlayer.load();
        if (manageVideoDialog.open) manageVideoDialog.close();
      };

      const uploadAsset = async (file, kind) => {
        const response = await fetch(serviceUrl(`/api/upload-file?kind=${encodeURIComponent(kind)}&filename=${encodeURIComponent(file.name)}`), {
          method: 'POST',
          headers: {
            'Content-Type': file.type || 'application/octet-stream',
          },
          body: file,
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok || !payload.path) {
          throw new Error(payload.error || translations[state.lang].uploadUnavailable);
        }

        return payload.path;
      };

      const saveUploadedWork = async (work) => {
        const response = await fetch(serviceUrl('/api/works'), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(work),
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok || !payload.work) {
          throw new Error(payload.error || translations[state.lang].uploadUnavailable);
        }

        return normalizeWork(payload.work);
      };

      const updateUploadedWork = async (workId, work) => {
        const response = await fetch(serviceUrl(`/api/works/${encodeURIComponent(workId)}`), {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(work),
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok || !payload.work) {
          throw new Error(payload.error || translations[state.lang].uploadUnavailable);
        }

        return normalizeWork(payload.work);
      };

      const deleteUploadedWorkRequest = async (workId) => {
        const response = await fetch(serviceUrl(`/api/works/${encodeURIComponent(workId)}`), {
          method: 'DELETE',
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || translations[state.lang].uploadUnavailable);
        }
      };

      const hydrateUploadedWorks = async () => {
        try {
          const response = await fetch(serviceUrl('/api/works'), { cache: 'no-store' });
          const payload = await response.json().catch(() => ({}));
          uploadedWorkData = Array.isArray(payload.works) ? payload.works.map(normalizeWork) : [];
        } catch (_) {
          uploadedWorkData = [];
        }
      };

      const waitForVideoEvent = (video, eventName) => new Promise((resolve, reject) => {
        const onSuccess = () => {
          cleanup();
          resolve();
        };
        const onError = () => {
          cleanup();
          reject(new Error('Unable to read the selected video.'));
        };
        const cleanup = () => {
          video.removeEventListener(eventName, onSuccess);
          video.removeEventListener('error', onError);
        };

        video.addEventListener(eventName, onSuccess, { once: true });
        video.addEventListener('error', onError, { once: true });
      });

      const generatePosterFromVideo = async (videoFile) => {
        const objectUrl = URL.createObjectURL(videoFile);
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        video.playsInline = true;
        video.src = objectUrl;

        try {
          await waitForVideoEvent(video, 'loadedmetadata');

          if (video.readyState < 2) {
            const seekTime = Number.isFinite(video.duration) && video.duration > 0.4
              ? Math.min(video.duration * 0.2, 1.2)
              : 0;

            if (seekTime > 0) {
              video.currentTime = seekTime;
              await waitForVideoEvent(video, 'seeked');
            } else {
              await waitForVideoEvent(video, 'loadeddata');
            }
          }

          const sourceWidth = video.videoWidth || 1280;
          const sourceHeight = video.videoHeight || 720;
          const targetWidth = Math.min(sourceWidth, 1600);
          const targetHeight = Math.max(1, Math.round(targetWidth * (sourceHeight / sourceWidth)));
          const canvas = document.createElement('canvas');
          canvas.width = targetWidth;
          canvas.height = targetHeight;
          const context = canvas.getContext('2d');

          if (!context) {
            throw new Error(translations[state.lang].uploadUnavailable);
          }

          context.drawImage(video, 0, 0, targetWidth, targetHeight);

          const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.9));
          if (!blob) {
            throw new Error('Unable to generate a poster image from the selected video.');
          }

          const stem = (videoFile.name || 'poster').replace(/\.[^.]+$/, '') || 'poster';
          return new File([blob], `${stem}-poster.jpg`, { type: 'image/jpeg' });
        } finally {
          URL.revokeObjectURL(objectUrl);
        }
      };

      const formatStamp = (value) => {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return state.lang === 'cn'
          ? date.toLocaleString('zh-CN', { hour12: false })
          : date.toLocaleString('en-US', { hour12: false });
      };

      const renderManagedWorks = () => {
        const copy = translations[state.lang];
        const works = managedWorks();

        if (!works.length) {
          manageList.innerHTML = `<div class="manage-empty">${escapeHtml(copy.manageEmpty)}</div>`;
          updateHeroMetrics();
          return;
        }

        manageList.innerHTML = works.map((item) => {
          const title = escapeHtml(state.lang === 'cn' ? item.cnTitle : item.enTitle);
          const subtitle = escapeHtml(state.lang === 'cn' ? item.cnSub : item.enSub);
          const description = escapeHtml(state.lang === 'cn' ? item.cnDesc : item.enDesc);
          const createdAt = escapeHtml(formatStamp(item.createdAt));
          const previewPath = escapeHtml(item.previewVideo || item.video || '');
          const poster = escapeHtml(item.poster || '');

          return `
            <article class="manage-card" data-work-id="${escapeHtml(item.id)}">
              <div class="manage-preview" data-preview-video="${previewPath}">
                ${poster ? `<img src="${poster}" alt="${title}" loading="lazy" />` : `<div class="preview-fallback">${escapeHtml(copy.manageNoPoster)}</div>`}
                <video muted loop playsinline preload="none" poster="${poster}" aria-label="${title}"></video>
                <button class="manage-preview-action" type="button" data-view-work="${escapeHtml(item.id)}" aria-label="${escapeHtml(copy.manageView)}：${title}"><span>${escapeHtml(copy.manageView)}</span></button>
              </div>
              <div class="manage-copy">
                <div class="manage-title-row">
                  <div class="manage-title">
                    <h3>${title}</h3>
                    <p>${subtitle}</p>
                  </div>
                  <span class="pill">${escapeHtml(isManagedWork(item) ? copy.manageItemTag : copy.manageBuiltInTag)}</span>
                </div>
                <div class="meta-grid">
                  <div class="meta-row">
                    <strong>${escapeHtml(copy.manageDescription)}</strong>
                    <span>${description || '—'}</span>
                  </div>
                  <div class="meta-row">
                    <strong>${escapeHtml(copy.manageCreated)}</strong>
                    <span>${createdAt}</span>
                  </div>
                </div>
                <div class="manage-actions">
                  <button class="btn" type="button" data-edit-work="${escapeHtml(item.id)}">${escapeHtml(copy.manageEdit)}</button>
                  ${isManagedWork(item) ? `<button class="btn danger" type="button" data-delete-work="${escapeHtml(item.id)}">${escapeHtml(copy.manageDelete)}</button>` : ''}
                </div>
              </div>
            </article>
          `;
        }).join('');

        updateHeroMetrics();
      };

      const applyLanguage = (lang) => {
        state.lang = lang;
        localStorage.setItem('site-lang', lang);
        document.documentElement.lang = lang === 'cn' ? 'zh-CN' : 'en';
        langSwitch.setAttribute('aria-pressed', String(lang === 'en'));
        langSwitch.setAttribute('aria-label', lang === 'cn' ? 'Switch to English' : '切换为中文');
        document.querySelector('.content').setAttribute('aria-label', lang === 'cn' ? '作品管理' : 'Project management');
        manageVideoDialog.setAttribute('aria-label', lang === 'cn' ? '作品视频预览' : 'Project video preview');
        manageVideoClose.setAttribute('aria-label', lang === 'cn' ? '关闭视频' : 'Close video');

        const copy = translations[lang];
        document.title = copy.pageTitle;
        brandRole.textContent = copy.brandRole;
        if (publicSiteLink) publicSiteLink.href = serviceUrl('/');
        publicSiteLinkLabel.textContent = copy.publicSiteLink;
        heroEyebrow.textContent = copy.heroEyebrow;
        heroTitle.textContent = copy.heroTitle;
        heroDesc.textContent = copy.heroDesc;
        heroWorkCountLabel.textContent = copy.heroWorkCountLabel;
        heroFormatLabel.textContent = copy.heroFormatLabel;
        privacyKicker.textContent = copy.privacyKicker;
        privacyNote.textContent = copy.privacyNote;
        syncKicker.textContent = copy.syncKicker;
        syncNote.textContent = copy.syncNote;
        uploadEyebrow.textContent = copy.uploadEyebrow;
        uploadPanelTitle.textContent = copy.uploadTitle;
        uploadPanelNote.textContent = copy.uploadNote;
        uploadCnTitleLabel.textContent = copy.uploadCnTitleLabel;
        uploadEnTitleLabel.textContent = copy.uploadEnTitleLabel;
        uploadCnSubLabel.textContent = copy.uploadCnSubLabel;
        uploadEnSubLabel.textContent = copy.uploadEnSubLabel;
        uploadCnDescLabel.textContent = copy.uploadCnDescLabel;
        uploadEnDescLabel.textContent = copy.uploadEnDescLabel;
        uploadVideoLabel.textContent = copy.uploadVideoLabel;
        uploadPosterLabel.textContent = copy.uploadPosterLabel;
        uploadVideoHelp.textContent = copy.uploadVideoHelp;
        uploadPosterHelp.textContent = copy.uploadPosterHelp;
        detailsGroupLabel.textContent = copy.detailsGroupLabel;
        mediaGroupLabel.textContent = copy.mediaGroupLabel;
        uploadHint.textContent = copy.uploadHint;
        uploadCnTitleInput.placeholder = copy.uploadCnTitlePlaceholder;
        uploadEnTitleInput.placeholder = copy.uploadEnTitlePlaceholder;
        uploadCnSubInput.placeholder = copy.uploadCnSubPlaceholder;
        uploadEnSubInput.placeholder = copy.uploadEnSubPlaceholder;
        uploadCnDescInput.placeholder = copy.uploadCnDescPlaceholder;
        uploadEnDescInput.placeholder = copy.uploadEnDescPlaceholder;
        manageKicker.textContent = copy.manageKicker;
        manageTitle.textContent = copy.manageTitle;
        manageNote.textContent = copy.manageNote;
        langCurrent.textContent = copy.langCurrent;
        langTarget.textContent = copy.langTarget;
        syncUploadModeUi();
        paintUploadStatus();
        renderManagedWorks();
      };

      langSwitch.addEventListener('click', () => {
        applyLanguage(state.lang === 'cn' ? 'en' : 'cn');
      });

      uploadCancelEdit.addEventListener('click', () => {
        setUploadMode('create');
        setUploadStatus('uploadIdle');
        uploadCnTitleInput.focus();
      });

      manageList.addEventListener('click', async (event) => {
        const viewButton = event.target.closest('[data-view-work]');
        const editButton = event.target.closest('[data-edit-work]');
        const deleteButton = event.target.closest('[data-delete-work]');

        if (viewButton) {
          const work = findUploadedWork(viewButton.getAttribute('data-view-work') || '');
          if (work) openWorkPreview(work);
          return;
        }

        if (editButton) {
          const workId = editButton.getAttribute('data-edit-work') || '';
          const work = findUploadedWork(workId);
          if (!work) return;
          openEditorForWork(work);
          return;
        }

        if (!deleteButton || uploadSubmitting) return;

        const workId = deleteButton.getAttribute('data-delete-work') || '';
        const work = findUploadedWork(workId);
        if (!work) return;
        if (!window.confirm(translations[state.lang].uploadDeleteConfirm)) return;

        setUploadSubmitting(true);
        setUploadStatus('uploadDeletingWork', 'pending');

        try {
          await deleteUploadedWorkRequest(workId);
          removeUploadedWork(workId);
          renderManagedWorks();
          if (editingWorkId === workId) {
            setUploadMode('create');
          }
          setUploadStatus('uploadDeleted', 'success');
        } catch (error) {
          setUploadStatus('uploadUnavailable', 'error', error instanceof Error ? error.message : translations[state.lang].uploadUnavailable);
        } finally {
          setUploadSubmitting(false);
        }
      });

      manageList.addEventListener('pointerover', (event) => {
        const preview = event.target.closest('.manage-preview');
        if (!preview || event.pointerType === 'touch') return;
        const card = preview.closest('.manage-card');
        const video = preview.querySelector('video');
        if (!video || video.dataset.loaded === 'true') return;
        video.src = preview.dataset.previewVideo;
        video.dataset.loaded = 'true';
        video.load();
        video.play().then(() => card.classList.add('is-previewing')).catch(() => {});
      });

      manageList.addEventListener('pointerout', (event) => {
        const preview = event.target.closest('.manage-preview');
        if (!preview || preview.contains(event.relatedTarget)) return;
        const video = preview.querySelector('video');
        const card = preview.closest('.manage-card');
        if (video) {
          video.pause();
          try { video.currentTime = 0; } catch (_) {}
        }
        card?.classList.remove('is-previewing');
      });

      manageVideoClose.addEventListener('click', closeWorkPreview);
      manageVideoDialog.addEventListener('click', (event) => {
        if (event.target === manageVideoDialog) closeWorkPreview();
      });
      manageVideoDialog.addEventListener('close', () => {
        manageVideoPlayer.pause();
        manageVideoPlayer.removeAttribute('src');
        manageVideoPlayer.load();
      });

      uploadForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (uploadSubmitting) return;

        const currentWork = uploadMode === 'edit' ? findUploadedWork(editingWorkId) : null;
        const wasEditing = uploadMode === 'edit' && !!currentWork;
        const videoFile = uploadVideoInput.files?.[0];
        const posterFile = uploadPosterInput.files?.[0];

        if (uploadMode === 'create' && !videoFile) {
          setUploadStatus('uploadNeedVideo', 'error');
          return;
        }

        if (uploadMode === 'edit' && !currentWork) {
          setUploadMode('create');
          setUploadStatus('uploadUnavailable', 'error');
          return;
        }

        setUploadSubmitting(true);

        try {
          let video = currentWork?.video || '';
          if (videoFile) {
            setUploadStatus('uploadUploadingVideo', 'pending');
            video = await uploadAsset(videoFile, 'video');
          }

          let poster = currentWork?.poster || '';
          if (posterFile) {
            setUploadStatus('uploadUploadingPoster', 'pending');
            poster = await uploadAsset(posterFile, 'poster');
          } else if (!poster && videoFile) {
            setUploadStatus('uploadGeneratingPoster', 'pending');
            const generatedPoster = await generatePosterFromVideo(videoFile);
            setUploadStatus('uploadUploadingPoster', 'pending');
            poster = await uploadAsset(generatedPoster, 'poster');
          }

          const nextWorkPayload = {
            cnTitle: uploadCnTitleInput.value || '',
            enTitle: uploadEnTitleInput.value || '',
            cnSub: uploadCnSubInput.value || '',
            enSub: uploadEnSubInput.value || '',
            cnDesc: uploadCnDescInput.value || '',
            enDesc: uploadEnDescInput.value || '',
            video,
            previewVideo: videoFile ? '' : (currentWork?.previewVideo || ''),
            webVideo: videoFile ? '' : (currentWork?.webVideo || ''),
            mobileVideo: videoFile ? '' : (currentWork?.mobileVideo || ''),
            poster,
          };

          let savedWork;
          if (uploadMode === 'edit' && currentWork) {
            setUploadStatus('uploadUpdatingWork', 'pending');
            savedWork = await updateUploadedWork(currentWork.id, nextWorkPayload);
            replaceUploadedWork(savedWork);
          } else {
            setUploadStatus('uploadSavingWork', 'pending');
            savedWork = await saveUploadedWork(nextWorkPayload);
            replaceUploadedWork(savedWork);
          }

          renderManagedWorks();
          setUploadMode('create');
          setUploadStatus(wasEditing ? 'uploadUpdated' : 'uploadSuccess', 'success');
        } catch (error) {
          setUploadStatus('uploadUnavailable', 'error', error instanceof Error ? error.message : translations[state.lang].uploadUnavailable);
        } finally {
          setUploadSubmitting(false);
        }
      });

      hydrateUploadedWorks().then(() => {
        setUploadMode('create');
        applyLanguage(state.lang);
      });
    })();
  </script>
</body>
</html>
