name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare site
        run: |
          rm -rf public
          mkdir -p public/assets public/data
          cp index.html public/index.html
          cp projects.html public/projects.html
          cp in-progress.html public/in-progress.html
          cp resume.html public/resume.html
          # 橘生梦厂已独立成站，在独立仓库 highstrith/jusheng 发布：这里不再打包 reel/。
          # 首页入口 https://highstrith.github.io/jusheng/，封面在 assets/film-recommendation/。
          # Source masters stay in git so media can be re-encoded, but they are
          # never published: every work ships optimized preview/mobile/web files,
          # and the pages only fall back to a source when one is missing.
          rsync -a --exclude '/originals/' --exclude '/works/' --exclude '/uploads/' assets/ public/assets/
          rsync -a --exclude '*.mp4' assets/uploads/ public/assets/uploads/
          cp -R data/. public/data/
          touch public/.nojekyll
          # 旧地址 /reel/ 只留一张跳转页：早前分享出去的链接不至于变成 404。
          mkdir -p public/reel
          printf '%s' '<!doctype html><meta charset="utf-8"><title>橘生梦厂</title><link rel="canonical" href="https://highstrith.github.io/jusheng/"><meta http-equiv="refresh" content="0; url=https://highstrith.github.io/jusheng/"><p>橘生梦厂已搬到 <a href="https://highstrith.github.io/jusheng/">highstrith.github.io/jusheng</a>。' > public/reel/index.html

      - name: Configure media CDN
        env:
          MEDIA_CDN_BASE_URL: ${{ vars.MEDIA_CDN_BASE_URL }}
        run: node scripts/prepare-media-cdn.mjs --site public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
