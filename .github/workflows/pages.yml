name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf public
          mkdir -p public/assets public/data
          cp index.html public/index.html
          cp projects.html public/projects.html
          cp in-progress.html public/in-progress.html
          cp resume.html public/resume.html
          # 片单是独立站点：只发布构建产物，封面母版（img/raw）留在仓库里
          mkdir -p public/reel
          rsync -a --exclude '/img/raw/' reel/ public/reel/
          # Source masters stay in git so media can be re-encoded, but they are
          # never published: every work ships optimized preview/mobile/web files,
          # and the pages only fall back to a source when one is missing.
          rsync -a --exclude '/originals/' --exclude '/works/' --exclude '/uploads/' assets/ public/assets/
          rsync -a --exclude '*.mp4' assets/uploads/ public/assets/uploads/
          cp -R data/. public/data/
          touch public/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
